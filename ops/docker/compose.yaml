name: diu

services:
  diu:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile
    container_name: diu-daemon
    expose:
      - "8081"
    volumes:
      - diu-data:/var/lib/diu
      - ./config.json:/var/lib/diu/.config/diu/config.json:ro
    environment:
      - DIU_LOG_LEVEL=debug
    restart: unless-stopped
    networks:
      - diu-network

  # E2E test runner
  e2e-tests:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.e2e
    container_name: diu-e2e
    command: ["-test.v", "-test.timeout=2m", "-test.run=^TestE2E"]
    init: true
    read_only: true
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,exec,nosuid,size=256m
      - /home/diu:rw,nosuid,size=16m,uid=1000,gid=1000
    depends_on:
      diu:
        condition: service_healthy
    environment:
      - DIU_API_URL=http://diu:8081
      - TEST_TIMEOUT=60s
    networks:
      - diu-network
    profiles:
      - e2e

  cli-e2e:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.e2e
    init: true
    read_only: true
    network_mode: none
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,exec,nosuid,size=256m
      - /home/diu:rw,nosuid,size=16m,uid=1000,gid=1000
    profiles:
      - cli-e2e

  # Simulated package managers for testing
  test-env:
    image: alpine:latest
    container_name: diu-test-env
    command: tail -f /dev/null
    volumes:
      - ../../tests/fixtures/scripts:/scripts:ro
    environment:
      - DIU_API_URL=http://diu:8081
    networks:
      - diu-network
    profiles:
      - e2e

volumes:
  diu-data:

networks:
  diu-network:
    driver: bridge

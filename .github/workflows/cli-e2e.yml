name: CLI Lifecycle E2Es

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Isolated CLI Lifecycle E2Es
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test real commands and filesystem cleanup
        run: docker compose -f ops/docker/compose.yaml --profile cli-e2e run --build --rm --no-deps cli-e2e

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: 'v2.13.2'
  GORELEASER_VERSION: 'v2.12.0'
  GOVULNCHECK_VERSION: 'v1.6.0'

jobs:
  release:
    name: Release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'

      - name: Install GoReleaser
        run: |
          RELEASE_PACKAGE="github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}"
          go install "$RELEASE_PACKAGE"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Bash
        run: brew install bash

      - name: Set up shell linters
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.9.0'
          install_args: shellcheck shfmt github:yowainwright/shellcheck_legibility
          env: false
          add_shims_to_path: false

      - name: Run shell linters
        run: mise run lint-shell

      - name: Run vet
        run: go vet ./...

      - name: Run linters
        run: |
          LINT_PACKAGE="github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          GOFLAGS="-mod=readonly -buildvcs=false" go run "$LINT_PACKAGE" custom
          ./bin/legibility-golangci-lint run --max-issues-per-linter=0 --max-same-issues=0 ./...

      - name: Run race tests
        run: go test -v -race ./...

      - name: Run govulncheck
        run: |
          VULN_PACKAGE="golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go run "$VULN_PACKAGE" ./...

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          goreleaser release --clean

  homebrew:
    name: Publish Homebrew formula
    needs: release
    runs-on: macos-latest
    steps:
      - name: Check out Homebrew tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yowainwright/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          ref: main
          persist-credentials: false
          path: homebrew-tap

      - name: Set up tap Ruby
        run: |
          brew list ruby >/dev/null 2>&1 || brew install ruby
          echo "$(brew --prefix ruby)/bin" >> "$GITHUB_PATH"

      - name: Update Homebrew formula
        working-directory: homebrew-tap
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          scripts/update-formula diu "${TAG_NAME#v}"
          scripts/validate-tap --strict

      - name: Open Homebrew formula pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Requires Contents and Pull requests write permissions on the tap.
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap
          add-paths: |
            Formula/diu.rb
            brews/diu.json
          base: main
          branch: diu-${{ github.ref_name }}
          commit-message: "diu ${{ github.ref_name }}"
          title: "diu ${{ github.ref_name }}"
          body: |
            Update the Homebrew formula to the published DIU release.

            Release: https://github.com/yowainwright/diu/releases/tag/${{ github.ref_name }}

            Generated from the published binaries by the tap's shared scripts/update-formula.
            Merge after the tap's required validation passes.

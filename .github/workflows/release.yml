name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: 'v2.13.2'
  GORELEASER_VERSION: 'v2.12.0'
  GOVULNCHECK_VERSION: 'v1.6.0'

jobs:
  release:
    name: Release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'

      - name: Install GoReleaser
        run: |
          RELEASE_PACKAGE="github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}"
          go install "$RELEASE_PACKAGE"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Bash
        run: brew install bash

      - name: Set up shell linters
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.9.0'
          install_args: shellcheck shfmt github:yowainwright/shellcheck_legibility
          env: false
          add_shims_to_path: false

      - name: Run shell linters
        run: mise run lint-shell

      - name: Run vet
        run: go vet ./...

      - name: Run linters
        run: |
          LINT_PACKAGE="github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          GOFLAGS="-mod=readonly -buildvcs=false" go run "$LINT_PACKAGE" custom
          ./bin/legibility-golangci-lint run --max-issues-per-linter=0 --max-same-issues=0 ./...

      - name: Run race tests
        run: go test -v -race ./...

      - name: Run govulncheck
        run: |
          VULN_PACKAGE="golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go run "$VULN_PACKAGE" ./...

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          goreleaser release --clean

  homebrew:
    name: Publish Homebrew formula
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Render Homebrew formula
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG_NAME#v}"
          ARCHIVE_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          ASSET_DIR="${GITHUB_WORKSPACE}/dist/homebrew"
          FORMULA_PATH="${ASSET_DIR}/diu.rb"

          mkdir -p "$ASSET_DIR"
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'diu_*_darwin_*.tar.gz' --pattern checksums.txt --dir "$ASSET_DIR"
          (cd "$ASSET_DIR" && shasum -a 256 -c checksums.txt)

          ops/scripts/render-homebrew-formula.sh \
            "$VERSION" "$ARCHIVE_BASE_URL" "$ASSET_DIR/checksums.txt" > "$FORMULA_PATH"
          ruby -c "$FORMULA_PATH"

          echo "FORMULA_PATH=$FORMULA_PATH" >> "$GITHUB_ENV"

      - name: Test Homebrew formula
        run: |
          TEST_TAP="yowainwright/diu-check"
          TEST_FORMULA="${TEST_TAP}/diu"

          cleanup_formula() {
            brew uninstall --force --ignore-dependencies diu || true
            brew untap "$TEST_TAP" || true
          }

          trap cleanup_formula EXIT
          brew untap "$TEST_TAP" || true

          brew tap-new --no-git "$TEST_TAP"
          TEST_TAP_REPO="$(brew --repository "$TEST_TAP")"
          cp "$FORMULA_PATH" "$TEST_TAP_REPO/Formula/diu.rb"

          brew audit --strict --online "$TEST_FORMULA"
          test -z "$(brew deps "$TEST_FORMULA")"
          brew install "$TEST_FORMULA"
          brew test "$TEST_FORMULA"

      - name: Save Homebrew formula
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew-formula
          path: ${{ env.FORMULA_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Check out Homebrew tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yowainwright/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          ref: main
          persist-credentials: false
          path: homebrew-tap

      - name: Prepare Homebrew formula
        run: |
          mkdir -p homebrew-tap/Formula
          cp "$FORMULA_PATH" homebrew-tap/Formula/diu.rb

      - name: Open Homebrew formula pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Requires Contents and Pull requests write permissions on the tap.
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap
          add-paths: Formula/diu.rb
          base: main
          branch: diu-${{ github.ref_name }}
          commit-message: "diu ${{ github.ref_name }}"
          title: "diu ${{ github.ref_name }}"
          body: |
            Update the Homebrew formula to the published DIU release.

            Release: https://github.com/yowainwright/diu/releases/tag/${{ github.ref_name }}

            The release workflow audited, installed, and tested this formula.
            Merge after the tap's required validation passes.
